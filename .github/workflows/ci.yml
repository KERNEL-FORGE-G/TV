# CI : qualité du code + APK release en artefact (push main / déclenchement manuel)
name: CI & Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  TERM: dumb
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

jobs:
  verify:
    name: Lint, TypeScript & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint + typecheck + jest)
        run: npm run verify

  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 90
    # APK : push sur main et lancement manuel (évite double build coûteux sur chaque PR)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch react-native-ir-manager
        run: bash scripts/patch-react-native-ir-manager.sh

      - name: Generate Android autolinking config
        run: npm run autolink

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant Gradle wrapper execute permission
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "telecommande-release-${{ github.sha }}.apk"
          cp "$APK" telecommande-release.apk
          ls -lh telecommande-release*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: telecommande-release-apk
          path: |
            telecommande-release.apk
            telecommande-release-${{ github.sha }}.apk
          retention-days: 90
          if-no-files-found: error

      - name: Job summary
        run: |
          {
            echo "## APK release"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branche:** \`${{ github.ref_name }}\`"
            echo "- **Artefact:** \`telecommande-release-apk\` (onglet Actions → cette exécution)"
            echo ""
            echo "Téléchargement : Actions → workflow **CI & Android Release** → run → Artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
